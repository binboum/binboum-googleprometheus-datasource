enableScripts: false

nodeLinker: node-modules

# Allow @grafana/prometheus's transitive git dependency (react-data-grid is
# vendored by Grafana from a fork). Restricted to the grafana org explicitly;
# arbitrary git sources remain blocked.
approvedGitRepositories:
  - 'https://github.com/grafana/*'

checksumBehavior: throw

defaultSemverRangePrefix: ''

nmHoistingLimits: workspaces

npmMinimalAgeGate: 4320 # 3 days in minutes

npmPreapprovedPackages:
  - '@grafana/*'

unsafeHttpWhitelist: []
