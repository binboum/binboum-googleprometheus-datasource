version: '3.7'

services:
  prometheus:
    image: prom/prometheus:v3.11.2@sha256:5550dc63da361dc30f6fe02ac0e4dfc736ededfef3c8d12a634db04a67824d78
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus

  grafana:
    user: root
    container_name: binboum-googleprometheus-datasource
    platform: linux/amd64
    depends_on:
      prometheus:
        condition: service_started
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.4.3}
    ports:
      - '3000:3000/tcp'
      - '2345:2345/tcp' # delve
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.binboum-googleprometheus-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: '1'
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: binboum-googleprometheus-datasource
      # Grafana 13 enables splashScreen by default; the overlay blocks Playwright interactions.
      GF_FEATURE_TOGGLES_splashScreen: 'false'
      # ADC: mount your application-default credentials and point at them.
      # Uncomment when you have a credentials file on the host:
      # GOOGLE_APPLICATION_CREDENTIALS: /etc/gcloud/application_default_credentials.json
    volumes:
      - ./dist:/var/lib/grafana/plugins/binboum-googleprometheus-datasource
      - ./provisioning:/etc/grafana/provisioning
      - .:/root/binboum-googleprometheus-datasource
      # Mount your gcloud config for ADC dev:
      # - ~/.config/gcloud:/etc/gcloud:ro
